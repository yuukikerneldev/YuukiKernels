name: YuukiKernel Universal GKI LTS CI

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      telegram_notify:
        description: 'Notify Telegram Channel?'
        required: false
        type: boolean
        default: true

jobs:
  build-gki-matrix:
    name: Build ${{ matrix.kernel.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kernel:
          - name: "GKI 6.12 LTS"
            dir: "GKI_6.12"
          - name: "GKI 5.10 LTS"
            dir: "GKI_5.10"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clean Runner Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/lib/jvm
          sudo apt-get clean

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex libssl-dev libncurses5-dev libelf-dev zip ccache git wget curl zstd python3 libtinfo6 || sudo apt-get install -y build-essential bison flex libssl-dev libelf-dev zip ccache git wget curl zstd python3

      - name: Setup Toolchain (Neutron Clang 24)
        run: |
          mkdir -p neutron-clang
          cd neutron-clang
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") -S
          cd ..

      - name: Build Kernel (${{ matrix.kernel.name }})
        run: |
          cd ${{ matrix.kernel.dir }}
          chmod +x build.sh
          ./build.sh

      - name: Locate Output Zip
        id: find_zip
        run: |
          ZIP_FILE=$(find ${{ matrix.kernel.dir }}/ -maxdepth 1 -name "YuukiKernel-*.zip" | head -n 1)
          if [ -f "$ZIP_FILE" ]; then
            echo "ZIP_PATH=$ZIP_FILE" >> $GITHUB_ENV
            echo "ZIP_NAME=$(basename $ZIP_FILE)" >> $GITHUB_ENV
            echo "MD5_HASH=$(md5sum $ZIP_FILE | awk '{print $1}')" >> $GITHUB_ENV
          else
            echo "::error::Zip file not found!"
            exit 1
          fi

      - name: Write Summary
        run: |
          echo "### YuukiKernel Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **File**: \`${{ env.ZIP_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **MD5**: \`${{ env.MD5_HASH }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Compiler**: Neutron Clang 24 (PGO/BOLT)" >> $GITHUB_STEP_SUMMARY
          echo "- **Root**: ReSukiSU v4.2.0-rc1 (Build 35089)" >> $GITHUB_STEP_SUMMARY
          echo "- **Features**: zRAM 6GB LZ4 | BBRv1 | Schedutil Game Turbo | BBG" >> $GITHUB_STEP_SUMMARY

      - name: Upload Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}

      - name: Notify Telegram Channel
        if: ${{ inputs.telegram_notify != false }}
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          if [ -z "$TOKEN" ]; then
            TOKEN="8699575652:AAHFvciYUnlEu0kJGDjESw78CvKVzUfbE8g"
          fi
          python3 telegram_publisher.py "$TOKEN" "${{ secrets.TELEGRAM_CHAT_ID || '@yuukikernels' }}"
