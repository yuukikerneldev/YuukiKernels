name: 🚀 YuukiKernel Universal GKI LTS Automated CI Builder

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      telegram_notify:
        description: 'Send Notification to Telegram Channel?'
        required: false
        type: boolean
        default: true

jobs:
  build-gki-matrix:
    name: 🛠️ Build ${{ matrix.kernel.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kernel:
          - name: "Universal GKI 6.12 LTS (Android 16)"
            dir: "GKI_6.12"
            version: "6.12.90"
            tag: "GKI-6.12"
          - name: "Universal GKI 5.10 LTS (Android 12)"
            dir: "GKI_5.10"
            version: "5.10.265"
            tag: "GKI-5.10"

    steps:
      - name: 📥 Checkout Codebase
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: 🧹 Optimize Storage
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/lib/jvm
          sudo apt-get clean

      - name: ⚙️ Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex libssl-dev libncurses5-dev libelf-dev zip ccache git wget curl zstd python3

      - name: 🚀 Setup Neutron Clang 24
        run: |
          if [ ! -d "neutron-clang" ]; then
            mkdir -p neutron-clang
            cd neutron-clang
            curl -LO "https://github.com/neutron-clang/clang-build-catalogue/releases/download/v24.0.0/neutron-clang-24.0.0.tar.zst" || true
            if [ -f "neutron-clang-24.0.0.tar.zst" ]; then
              tar -I zstd -xf neutron-clang-24.0.0.tar.zst
            fi
            cd ..
          fi

      - name: 🔨 Compile ${{ matrix.kernel.name }}
        run: |
          cd ${{ matrix.kernel.dir }}
          chmod +x build.sh
          ./build.sh

      - name: 🔍 Store Output Package
        id: find_zip
        run: |
          ZIP_FILE=$(find ${{ matrix.kernel.dir }}/ -maxdepth 1 -name "YuukiKernel-*.zip" | head -n 1)
          if [ -f "$ZIP_FILE" ]; then
            echo "ZIP_PATH=$ZIP_FILE" >> $GITHUB_ENV
            echo "ZIP_NAME=$(basename $ZIP_FILE)" >> $GITHUB_ENV
            echo "MD5_HASH=$(md5sum $ZIP_FILE | awk '{print $1}')" >> $GITHUB_ENV
          else
            echo "::error::Zip file not found!"
            exit 1
          fi

      - name: 📊 Summary Report
        run: |
          echo "### ⚡ Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact**: \`${{ env.ZIP_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **MD5**: \`${{ env.MD5_HASH }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Toolchain**: Neutron Clang 24 (PGO/BOLT)" >> $GITHUB_STEP_SUMMARY
          echo "- **Root Engine**: ReSukiSU v4.2.0-rc1 (Build 35089)" >> $GITHUB_STEP_SUMMARY
          echo "- **Features**: zRAM 6GB LZ4 | BBRv1 | Schedutil Game Turbo | BBG" >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}

      - name: 📲 Post CI Notification to Telegram
        if: ${{ inputs.telegram_notify != false }}
        run: |
          TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          if [ -z "$TOKEN" ]; then
            TOKEN="8699575652:AAHFvciYUnlEu0kJGDjESw78CvKVzUfbE8g"
          fi
          python3 telegram_publisher.py "$TOKEN" "${{ secrets.TELEGRAM_CHAT_ID || '@yuukikernels' }}"
