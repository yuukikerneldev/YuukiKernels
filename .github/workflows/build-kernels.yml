name: ⚡ YuukiKernel Dual GKI LTS Builder CI

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Choose kernel to build'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'gki_6.12'
          - 'gki_5.10'

jobs:
  build-gki-kernels:
    name: 🏗️ Build GKI Kernels (Neutron Clang)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: 🧹 Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          sudo apt-get clean

      - name: ⚙️ Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex libssl-dev libncurses5-dev libelf-dev zip ccache git wget curl

      - name: 🚀 Download & Setup Neutron Clang 24
        run: |
          mkdir -p neutron-clang
          cd neutron-clang
          curl -LO "https://github.com/neutron-clang/clang-build-catalogue/releases/download/v24.0.0/neutron-clang-24.0.0.tar.zst" || \
          curl -LO "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz"
          tar -xf *.tar.* || true
          cd ..

      - name: 🔨 Build GKI 6.12 LTS
        if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'gki_6.12' || github.event_name == 'push' }}
        run: |
          cd GKI_6.12
          chmod +x build.sh
          ./build.sh

      - name: 🔨 Build GKI 5.10 LTS
        if: ${{ github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'gki_5.10' || github.event_name == 'push' }}
        run: |
          cd GKI_5.10
          chmod +x build.sh
          ./build.sh

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YuukiKernel-Builds
          path: |
            GKI_6.12/*.zip
            GKI_5.10/*.zip
